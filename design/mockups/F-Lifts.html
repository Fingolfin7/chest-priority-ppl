<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout-first · Lifts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
a{color:#86d2c9}a:hover{color:#b5e6e0}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0f141a; color: #edf2f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.35">

  <header style="display: flex; align-items: center; gap: 4px; padding: 6px 16px 0 8px">
    <a href="F-Train.html" aria-label="Menu: Train, Progress, Sessions, Plan, devices, Autumn, data, theme" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #edf2f7">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">Progress</h1>
  </header>

  <div role="tablist" aria-label="Progress to view" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; margin: 8px 16px 0; padding: 2px; border-radius: 10px; background: #171d24">
    <button type="button" role="tab" aria-selected="false" style="height: 40px; border: none; border-radius: 8px; background: transparent; color: #9ca8b5; font-size: 14px; font-weight: 600; cursor: pointer">Body</button>
    <button type="button" role="tab" aria-selected="true" style="height: 40px; border: none; border-radius: 8px; background: #2a333d; font-size: 14px; font-weight: 600; cursor: pointer">Lifts</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; border: none; border-radius: 8px; background: transparent; color: #9ca8b5; font-size: 14px; font-weight: 600; cursor: pointer">Photos</button>
  </div>

  <section style="margin: 12px 16px 0; padding: 12px; border-radius: 12px; background: #171d24">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Lift shown: Back squat. Choose another" style="height: 40px; padding: 0; border: none; background: transparent; font-size: 17px; font-weight: 700; cursor: pointer">Back squat ▾</button>
      <div role="group" aria-label="Measure" style="display: flex; padding: 2px; border-radius: 8px; background: #0f141a">
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 10px; border: none; border-radius: 6px; background: #2a333d; font-size: 13px; font-weight: 600; cursor: pointer">Weight</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 10px; border: none; border-radius: 6px; background: transparent; color: #9ca8b5; font-size: 13px; font-weight: 600; cursor: pointer">Volume</button>
      </div>
    </div>
    <svg width="334" height="132" viewBox="0 0 334 132" role="img" aria-label="Back squat heaviest set, 9 sessions from 13 Aug to 29 Sep, rising from 60 to 65 kg" style="display: block; margin-top: 8px">
      <g style="font: 11px -apple-system, system-ui, sans-serif" fill="#9ca8b5">
        <text x="0" y="14">70</text><text x="0" y="64">65</text><text x="0" y="114">60</text>
        <text x="28" y="130">13 Aug</text><text x="180" y="130" text-anchor="middle">7 Sep</text><text x="334" y="130" text-anchor="end">29 Sep</text>
      </g>
      <g stroke="#29323c"><line x1="24" y1="10" x2="334" y2="10"></line><line x1="24" y1="60" x2="334" y2="60"></line><line x1="24" y1="110" x2="334" y2="110"></line></g>
      <polyline fill="none" stroke="#42a297" points="30,110 66,110 104,110 142,85 180,85 218,85 256,60 294,60 330,60" style="stroke-width: 2; stroke-linejoin: round"></polyline>
      <g fill="#42a297"><circle cx="30" cy="110" r="3"></circle><circle cx="66" cy="110" r="3"></circle><circle cx="104" cy="110" r="3"></circle><circle cx="142" cy="85" r="3"></circle><circle cx="180" cy="85" r="3"></circle><circle cx="218" cy="85" r="3"></circle><circle cx="256" cy="60" r="3"></circle><circle cx="294" cy="60" r="3"></circle></g>
      <circle cx="330" cy="60" r="5" fill="#0f141a" stroke="#42a297" style="stroke-width: 2.5"></circle>
    </svg>
    <p style="margin: 6px 0 0; font-size: 13px; color: #9ca8b5; font-variant-numeric: tabular-nums"><strong style="color: #edf2f7">Tue 29 Sep · 65 × 7, 7, 7</strong> · +5 kg since 13 Aug</p>
  </section>

  <h2 style="margin: 16px 16px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #9ca8b5">ALL LIFTS · BEST SET</h2>
  <ul style="list-style: none; margin: 0 16px; padding: 0; font-variant-numeric: tabular-nums">
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid #29323c; background: #171d24; margin: 0 -8px; padding: 0 8px; border-radius: 8px"><span style="font-weight: 600">Back squat</span><svg width="72" height="20" viewBox="0 0 72 20" aria-hidden="true"><polyline fill="none" stroke="#42a297" points="2,18 20,18 38,11 56,4 70,4" style="stroke-width: 1.5"></polyline></svg><span style="text-align: right">65 × 7</span></li>
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid #29323c"><span>Conventional deadlift</span><svg width="72" height="20" viewBox="0 0 72 20" aria-hidden="true"><polyline fill="none" stroke="#9ca8b5" points="2,14 20,10 38,6 56,6 70,6" style="stroke-width: 1.5"></polyline></svg><span style="text-align: right">95 × 6</span></li>
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid #29323c"><span>Bent-over barbell row</span><svg width="72" height="20" viewBox="0 0 72 20" aria-hidden="true"><polyline fill="none" stroke="#9ca8b5" points="2,18 20,14 38,10 56,6 70,3" style="stroke-width: 1.5"></polyline></svg><span style="text-align: right">65 × 8</span></li>
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid #29323c"><span>Barbell bench press</span><svg width="72" height="20" viewBox="0 0 72 20" aria-hidden="true"><polyline fill="none" stroke="#9ca8b5" points="2,12 20,12 38,10 56,10 70,8" style="stroke-width: 1.5"></polyline></svg><span style="text-align: right">60 × 6</span></li>
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid #29323c"><span>Lat pulldown</span><svg width="72" height="20" viewBox="0 0 72 20" aria-hidden="true"><polyline fill="none" stroke="#9ca8b5" points="2,10 20,10 38,10 56,10 70,10" style="stroke-width: 1.5"></polyline></svg><span style="text-align: right">60 × 10</span></li>
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid #29323c"><span>Barbell curl</span><svg width="72" height="20" viewBox="0 0 72 20" aria-hidden="true"><polyline fill="none" stroke="#9ca8b5" points="2,18 20,16 38,14 56,10 70,4" style="stroke-width: 1.5"></polyline></svg><span style="text-align: right">30 × 12</span></li>
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 70px; gap: 8px; align-items: center; min-height: 48px; border-bottom: 1px solid #29323c"><span>Incline dumbbell press</span><svg width="72" height="20" viewBox="0 0 72 20" aria-hidden="true"><polyline fill="none" stroke="#9ca8b5" points="2,14 20,12 38,12 56,9 70,8" style="stroke-width: 1.5"></polyline></svg><span style="text-align: right">22.5 × 8</span></li>
  </ul>
</div>
</body>
</html>
